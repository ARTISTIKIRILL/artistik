
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %}Мой проект{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
            <div class="container-fluid">
                <img src="https://i.yapx.ru/dIKzI.png" width="120" alt="Логотип сайта" class="me-3">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarScroll">
                    <ul class="navbar-nav me-auto my-2 my-lg-0">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'home_page' %}">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/rating/' %}active{% endif %}" href="{% url 'rating_page' %}">Рейтинг</a>
                        </li>
                    </ul>
                    {% if user.is_authenticated %}
                        <div id="userSection">
                            <span class="navbar-text me-3">Привет, {{ user.name }}!</span>
                            <button class="btn btn-outline-light" onclick="logout()">Выйти</button>
                        </div>
                    {% else %}
                        <a href="{% url 'signin_page' %}" class="btn btn-outline-light me-1">Войти</a>
                        <a href="{% url 'signup_page' %}" class="btn btn-outline-light">Зарегистрироваться</a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="navbar-custom text-light py-3 mt-5">
        <div class="container">
            <div class="text-center">
                <p class="mb-0">&copy; 2024 Проект ученика МАОУ лицея №97 Герасимова Кирилла. Все права защищены.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script>
        function getCsrfToken() {
            return document.querySelector('[name=csrf-token]').getAttribute('content');
        }

        async function logout() {
            try {
                const response = await fetch('/api/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    credentials: 'same-origin'
                });
                
                if (response.ok) {
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
